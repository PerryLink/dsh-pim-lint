<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">dsh-pim-lint: two channels — whole-table rule matrix and single-code GS1 probe, one in-memory return</title>
<desc id="fig-desc">Channel A: catalog.csv goes through a CSV guard (E_PIM_CSV_EMPTY / E_PIM_HEADER / E_PIM_CSV_ROW throw, never an issue), then 12 rows enter a 4-field x 7-rule matrix (SKU required/duplicate, title required, GTIN invalid/duplicate, price invalid/precision) and produce issues[] as SKU/field/code. Channel B checks a 14-digit GTIN for format, packaging indicator and variable measure, and an 18-digit SSCC for format versus mod-10 checksum. All returns stay in memory: R0, no file writes, no network, no model call.</desc>
