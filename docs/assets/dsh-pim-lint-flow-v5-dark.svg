  <linearGradient id="bg" x1="0" y1="0" x2="0.34" y2="1">
    <stop offset="0" stop-color="#131a2a"/>
    <stop offset="1" stop-color="#0c1016"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.75" cy="0.05" r="0.7">
    <stop offset="0" stop-color="#8496f5" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#8496f5" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-12%" y="-18%" width="124%" height="142%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.50"/>
  </filter>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8496f5"/>
  </marker>
</defs>
